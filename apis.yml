name: JOBDOH
description: JOBDOH is a Hong Kong-based on-demand hiring and staffing platform that
  connects employers with temporary, part-time, and short-term workers, letting businesses
  staff up within 24 hours and job seekers find flexible work in one minute. The bilingual
  (English/Chinese) service spans market research, sales and promotion, exhibitions
  and events, hospitality, personal assistance, logistics, creative, and beauty roles.
  Hiring and job applications run through a mobile-app and web experience; there is
  no public API, developer portal, or SDK at this time. Surfaced as a portfolio company
  of Seedcamp and added to the API Evangelist network.
